name: Build and Release Windows Applications

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure node-gyp & Install Dependencies
        run: |
          cd electron_app
          npm config set msvs_version 2022
          npm install

      - name: Build Web Bundle
        run: |
          cd electron_app
          npm run build

      - name: Build Electron Windows Package (.exe)
        run: |
          cd electron_app
          npx electron-builder --windows --publish never

      - name: Upload Electron EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BQ_tester_Electron_Windows
          path: electron_app/dist_electron/*.exe

      - name: Release Electron EXE to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: electron_app/dist_electron/*.exe
          name: Release ${{ github.ref_name }} (Electron High-Performance)
          body: |
            ## BQ_tester v2.0.3 Electron High-Performance Windows Release
            - **Native Electron App** (Zero Python UI lag, Chromium GPU 60FPS graph rendering).
            - **`node-hid` Direct C++ USB Engine**: Asynchronous non-blocking EV2400 SMBus polling (PID 0x0037/0x0036).
            - Supports direct out-of-the-box TI EV2400 / EV2300 USB HID adapters.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
